; MorseOS bundle: what goes into the firmware.
; Apps and features set to n are left out together with every library only they use
; (sources, RAM, GATT services, menu entries). See tools/bundle.py and IDEE.md.

[bundle]
name    = morseos
version = 0.8.3

[apps]
face     = y   ; watch face, the home screen
info     = y   ; MENU > INFO
practice = y   ; STRUMENTI > PRATICA
btscan   = y   ; STRUMENTI > BLUETOOTH: devices nearby (scan only while open, or /bt/scan)
reflex   = y   ; GIOCHI > RIFLESSI: reaction time, the placeholder game of the GIOCHI menu
settings = y   ; MENU > IMPOSTAZIONI, after STRUMENTI: Morse speed, vibration (RAM only for now)
sensors  = n   ; STRUMENTI > SENSORI: find the I2C sensors (off on the second band: its probe pins PC4/PC7 may power the touch IC)
message  = y   ; notifications from the FitPro UART

[features]
fitpro   = y   ; FitPro UART: lt716 settime / notify / find
assetwrite = n ; dumper commands 10-13 (erase / write the stock asset area 0x29000-0x70000):
               ; off since 0.8.1, MorseOS does not use those assets; 256 B of RAM and the only
               ; flash erase/write code besides the 4 bytes of the way back to the updater

[options]
clock    = font ; watch face digits: font (antialiased Ubuntu Condensed Bold, blinking colon)
                ; or segments (the 7-segment clock of 0.3-0.6)

[hardware]
band     = auto ; display wiring: auto = detect from the panel ID at boot, 1 = first band
                ; (ST7735S, DC PC1, backlight PB3), 2 = second band (GC9107, DC PC6, PA2, PA0)
