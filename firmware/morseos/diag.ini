; MorseOS "diag": hardware discovery microfirmware. The safe core (BLE, files, OTA return,
; watchdog and boot counter), the watch face, and lib/hwscan: echo 1 > ~/band/hw/scan, then
; cat ~/band/hw/scan. Build: BUNDLE=diag.ini firmware/build.sh morseos -B BAND=2
[bundle]
name    = morseos-diag
version = 0.8.12-diag2

[apps]
face     = y

[features]
hwscan   = y

[options]
clock    = font

[hardware]
band     = auto
